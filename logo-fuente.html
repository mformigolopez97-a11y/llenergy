<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:transparent}
#lienzo{width:100vw;height:100vw}svg{display:block;width:100%;height:100%}</style>
</head><body><div id="lienzo">
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- La baldosa. Sin sombra alrededor: Marcos pidio quitarla. -->
  <linearGradient id="gTile" gradientUnits="userSpaceOnUse" x1="200" y1="110" x2="760" y2="900">
    <stop offset="0"    stop-color="#242A33"/>
    <stop offset="0.5"  stop-color="#1A1F27"/>
    <stop offset="1"    stop-color="#13171D"/>
  </linearGradient>

  <!-- EL SOL · el eje va de abajo-izquierda (naranja hondo) a la derecha
       (amarillo encendido), que es donde esta el reflejo fuerte. -->
  <linearGradient id="gSol" gradientUnits="userSpaceOnUse" x1="340" y1="512" x2="702" y2="424">
    <stop offset="0"    stop-color="#EA5A06"/>
    <stop offset="0.20" stop-color="#F2740C"/>
    <stop offset="0.44" stop-color="#F9920F"/>
    <stop offset="0.68" stop-color="#FDB61C"/>
    <stop offset="0.88" stop-color="#FFD63F"/>
    <stop offset="1"    stop-color="#FFF0A0"/>
  </linearGradient>
  <!-- el reflejo de mas intensidad, en el costado derecho junto al horizonte -->
  <radialGradient id="gReflejo" gradientUnits="userSpaceOnUse" cx="668" cy="424" r="152">
    <stop offset="0"   stop-color="#FFF8C4" stop-opacity="0.95"/>
    <stop offset="0.4" stop-color="#FFE066" stop-opacity="0.55"/>
    <stop offset="1"   stop-color="#FFD24A" stop-opacity="0"/>
  </radialGradient>
  <!-- un reflejo mas suave en la coronilla -->
  <radialGradient id="gCorona" gradientUnits="userSpaceOnUse" cx="556" cy="330" r="128">
    <stop offset="0"   stop-color="#FFF0A8" stop-opacity="0.55"/>
    <stop offset="1"   stop-color="#FFD24A" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gHalo" gradientUnits="userSpaceOnUse" cx="513" cy="448" r="262">
    <stop offset="0.62" stop-color="#FF9A1E" stop-opacity="0.34"/>
    <stop offset="1"    stop-color="#FF9A1E" stop-opacity="0"/>
  </radialGradient>

  <!-- LOS RAYOS · mas amarillos cuanto mas arriba -->
  <linearGradient id="gRayo" gradientUnits="userSpaceOnUse" x1="512" y1="500" x2="512" y2="130">
    <stop offset="0"    stop-color="#F8880F"/>
    <stop offset="0.45" stop-color="#FDA91B"/>
    <stop offset="1"    stop-color="#FFD960"/>
  </linearGradient>

  <!-- EL VERDE · tres tonos, uno por capa -->
  <linearGradient id="gVerdeC" gradientUnits="userSpaceOnUse" x1="336" y1="682" x2="808" y2="562">
    <stop offset="0"    stop-color="#0B7C6E"/>
    <stop offset="0.38" stop-color="#0F9A6B"/>
    <stop offset="0.72" stop-color="#22BE60"/>
    <stop offset="1"    stop-color="#57D96B"/>
  </linearGradient>
  <linearGradient id="gVerdeB" gradientUnits="userSpaceOnUse" x1="242" y1="600" x2="832" y2="468">
    <stop offset="0"    stop-color="#12A183"/>
    <stop offset="0.26" stop-color="#18BA73"/>
    <stop offset="0.55" stop-color="#34CC63"/>
    <stop offset="0.80" stop-color="#83E278"/>
    <stop offset="1"    stop-color="#F4FEDC"/>
  </linearGradient>
  <linearGradient id="gVerdeA" gradientUnits="userSpaceOnUse" x1="472" y1="546" x2="832" y2="468">
    <stop offset="0"    stop-color="#3FD07A" stop-opacity="0.0"/>
    <stop offset="0.35" stop-color="#7BE38A" stop-opacity="0.55"/>
    <stop offset="0.78" stop-color="#CBF5B0" stop-opacity="0.85"/>
    <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0.95"/>
  </linearGradient>

  <linearGradient id="gTexto" gradientUnits="userSpaceOnUse" x1="215" y1="706" x2="820" y2="832">
    <stop offset="0"    stop-color="#FFFFFF"/>
    <stop offset="0.38" stop-color="#F6F9FC"/>
    <stop offset="0.72" stop-color="#D4DCE4"/>
    <stop offset="1"    stop-color="#A7B3BF"/>
  </linearGradient>

  <filter id="brilloRayo" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sombraVerde" x="-25%" y="-45%" width="150%" height="200%">
    <feDropShadow dx="-2" dy="-12" stdDeviation="6" flood-color="#04070C" flood-opacity="0.92"/>
    <feDropShadow dx="0"  dy="13"  stdDeviation="6" flood-color="#04070C" flood-opacity="0.80"/>
  </filter>
  <filter id="sombraTexto" x="-15%" y="-40%" width="130%" height="190%">
    <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <clipPath id="recorte"><rect x="106" y="92" width="812" height="844" rx="202"/></clipPath>
</defs>

<rect width="1024" height="1024" fill="#090D13"/>
<rect x="106" y="92" width="812" height="844" rx="202" fill="url(#gTile)"/>

<g clip-path="url(#recorte)">
  <g stroke="url(#gRayo)" stroke-width="27" stroke-linecap="round" filter="url(#brilloRayo)">
    <line x1="722" y1="452" x2="808" y2="452"/>
    <line x1="694" y1="347" x2="769" y2="304"/>
    <line x1="617" y1="270" x2="660" y2="196"/>
    <line x1="513" y1="242" x2="513" y2="156"/>
    <line x1="409" y1="270" x2="366" y2="196"/>
    <line x1="332" y1="347" x2="257" y2="304"/>
    <line x1="304" y1="452" x2="218" y2="452"/>
  </g>

  <circle cx="513" cy="448" r="262" fill="url(#gHalo)"/>
  <circle cx="513" cy="448" r="180" fill="url(#gSol)"/>
  <circle cx="513" cy="448" r="180" fill="url(#gCorona)"/>
  <circle cx="513" cy="448" r="180" fill="url(#gReflejo)"/>

  <!-- tono 3: la hoja de abajo, la mas oscura -->
  <path d="M 336,646 C 466,594 642,560 808,572 C 722,672 476,704 336,646 Z"
        fill="url(#gVerdeC)"/>
  <!-- tono 2: la hoja grande, del verde azulado al lima encendido -->
  <g filter="url(#sombraVerde)">
    <path d="M 240,578 C 394,500 606,452 832,468 C 738,606 452,716 240,578 Z"
          fill="url(#gVerdeB)"/>
  </g>
  <!-- tono 1: el pliegue claro de arriba, casi blanco en la punta -->
  <path d="M 478,536 C 598,490 718,466 832,468 C 758,514 624,552 478,536 Z"
        fill="url(#gVerdeA)"/>

  <text x="512" y="806" text-anchor="middle" fill="url(#gTexto)" filter="url(#sombraTexto)"
        font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="800"
        font-size="128" letter-spacing="-4">L.L.Energy</text>
</g>
</svg></div></body></html>
