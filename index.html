<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LLEnergy</title>
<link rel="icon" href="icono-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LLEnergy">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════
   LLEnergy · Light of Life Energy
   Instrumento de trabajo, no folleto: fondo negro, número grande,
   y un color por cada cosa que el color significa.
   Azul = se puede tocar · Verde = está bien · Ámbar = ojo · Rojo = no.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --negro:#0A0B0D;
  --panel:#15181C;
  --panel2:#1D2127;
  --linea:#282E36;
  --linea2:#1F242B;
  --blanco:#EEF2F6;
  --gris:#8B96A5;
  --gris2:#5C6675;

  /* El verde es a la vez «se puede tocar» y «está bien»: en esta app las dos
     cosas nunca compiten, porque una vive en la barra y la otra en las filas.
     La menta queda para lo informativo, que ni es bueno ni es malo. */
  --verde:#2FD97F;   --verde-h:#55E89A;  --verde-s:rgba(47,217,127,.13);
  --menta:#5EEAD4;   --menta-s:rgba(94,234,212,.12);
  --naranja:#FF8A3C; --naranja-h:#FFA05E; --naranja-s:rgba(255,138,60,.14);
  --ambar:#FBBF24;   --ambar-s:rgba(251,191,36,.12);
  --rojo:#FB7185;    --rojo-s:rgba(251,113,133,.12);

  --r:14px; --nav:66px;
}
*{box-sizing:border-box}
html{background:var(--negro); height:100%}
body{background:var(--negro); color:var(--blanco);
  font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  margin:0; height:100dvh; min-height:100dvh; overflow:hidden;
  display:flex; flex-direction:column}
@supports not (height:100dvh){ body{height:100vh; min-height:100vh} }
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif; margin:0; text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button{font:inherit; cursor:pointer; color:inherit}
a{color:var(--verde)}
::selection{background:var(--verde); color:var(--negro)}

/* ── cabecera ── */
.top{flex:0 0 auto; z-index:40; background:var(--negro);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--linea2)}
.top-fila{display:flex; align-items:center; justify-content:space-between; gap:10px}
.logo{display:flex; align-items:center; gap:9px; min-width:0}
.logo .sol{width:36px; height:32px; flex-shrink:0}
/* El nombre, en blanco a plata como en el logo: es la misma marca, no dos. */
.logo .n{font-family:"Archivo",sans-serif; font-size:22px; font-weight:800;
  letter-spacing:-.03em; line-height:1;
  background:linear-gradient(115deg, #FFFFFF 0%, #F2F5F8 42%, #C6D0DA 78%, #A7B3BF 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent}
.logo .n span{color:inherit}

.rol{display:flex; gap:2px; background:var(--panel2); border-radius:10px; padding:3px;
  border:1px solid var(--linea)}
.rol button{border:none; background:transparent; color:var(--gris); border-radius:7px;
  padding:6px 12px; font-size:10.5px; font-weight:700; font-family:"IBM Plex Mono",monospace;
  letter-spacing:.08em; text-transform:uppercase; display:flex; align-items:center; gap:5px}
.rol button[aria-pressed="true"]{background:var(--naranja); color:#180A02}
.rol button:not([aria-pressed="true"]):hover{color:var(--naranja)}
.rol button svg{width:12px; height:12px}

.trabajo-actual{margin-top:9px; display:flex; align-items:center; gap:9px;
  background:var(--panel); border:1px solid var(--linea); border-radius:11px;
  padding:9px 9px 9px 13px; font-size:14.5px}
.trabajo-actual .et{font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:700;
  letter-spacing:.11em; text-transform:uppercase; color:var(--gris2)}
.trabajo-actual .nm{font-weight:600; flex:1; min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.trabajo-actual button{border:1px solid var(--linea); background:var(--panel2); color:var(--verde);
  border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:600}

/* ── contenido ── */
main{flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 26px);
  max-width:980px; margin:0 auto}
.pant{display:none}
.pant.on{display:block}

.caja{background:var(--panel); border:1px solid var(--linea); border-radius:var(--r);
  margin-bottom:13px; overflow:hidden}
.caja > h2{font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:.14em; color:var(--gris2);
  padding:13px 16px 11px; border-bottom:1px solid var(--linea2)}
.cuerpo{padding:4px 16px 12px}
.yatrae{margin:14px -16px -12px; padding:11px 16px; background:var(--verde-s);
  border-top:1px solid var(--linea); font-size:12.5px; color:var(--gris); line-height:1.5}
.yatrae b{color:var(--verde); font-weight:600}
/* ─── Contar los aparatos de la casa ─── */
.caja h2 .cont{display:inline-block; margin-left:8px; padding:2px 8px; border-radius:20px;
  font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700;
  color:var(--negro); background:var(--naranja); vertical-align:2px}

details.grupo{border-top:1px solid var(--linea2)}
details.grupo:first-child{border-top:none}
details.grupo > summary{display:flex; justify-content:space-between; align-items:center;
  gap:10px; padding:13px 2px; cursor:pointer; list-style:none;
  font-family:"Archivo",sans-serif; font-size:14.5px; font-weight:700; color:var(--blanco)}
details.grupo > summary::-webkit-details-marker{display:none}
details.grupo > summary::after{content:"+"; order:3; font-family:"IBM Plex Mono",monospace;
  font-size:16px; color:var(--gris2); width:14px; text-align:center}
details.grupo[open] > summary::after{content:"–"}
details.grupo > summary > span{margin-left:auto; font-family:"IBM Plex Mono",monospace;
  font-size:10.5px; font-weight:700; color:var(--gris2)}
details.grupo > summary > span.si{color:var(--naranja)}
.aps{padding-bottom:8px}
.ap{display:flex; align-items:center; gap:12px; padding:8px 0 9px;
  border-top:1px solid var(--linea2)}
.ap > label{flex:1; min-width:0; font-size:14px; color:var(--gris); line-height:1.4}
.ap > label small{display:block; font-family:"IBM Plex Mono",monospace; font-size:10.5px;
  color:var(--gris2); margin-top:3px; letter-spacing:.01em}
.ap > label small b{color:var(--verde); font-weight:700}
.ap > input{flex:0 0 62px; width:62px; text-align:center; padding:9px 4px;
  font-family:"IBM Plex Mono",monospace; font-size:15px; font-weight:700}
.ap.hay > label{color:var(--blanco)}
.ap.hay > input{border-color:rgba(255,138,60,.45); color:var(--naranja);
  background:var(--naranja-s)}

/* ─── La tira de fases: donde va el trabajo ─── */
.tira{display:flex; align-items:flex-start; gap:0; margin:2px 0 0}
.fase{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;
  gap:7px; position:relative}
.fase::after{content:""; position:absolute; top:6px; left:50%; width:100%; height:2px;
  background:var(--linea); z-index:0}
.fase:last-child::after{display:none}
.fase.hecha::after{background:var(--verde)}
.fase .pun{width:14px; height:14px; border-radius:50%; background:var(--panel2);
  border:2px solid var(--linea); position:relative; z-index:1}
.fase.hecha .pun{background:var(--verde); border-color:var(--verde)}
.fase.ahora .pun{background:var(--naranja); border-color:var(--naranja);
  box-shadow:0 0 0 4px var(--naranja-s)}
.fase .et{font-family:"IBM Plex Mono",monospace; font-size:8.5px; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase; color:var(--gris2);
  text-align:center; line-height:1.3}
.fase.hecha .et{color:var(--gris)}
.fase.ahora .et{color:var(--naranja)}

/* ─── Lo que falta para poder calcular ─── */
.pasos{display:flex; flex-direction:column; gap:2px; margin-top:4px}
.paso{display:flex; align-items:center; gap:9px; padding:11px 0;
  border-top:1px solid var(--linea2); font-size:14.5px; color:var(--gris)}
.paso:first-child{border-top:none}
.paso b{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:12px;
  font-weight:700; color:var(--ambar); text-align:right}
.paso.listo{color:var(--blanco)}
.paso.listo b{color:var(--verde)}

/* ─── Prueba de banco: la lista que se recorre antes de irse ─── */
.chk{display:flex; gap:12px; align-items:flex-start; padding:12px 0 13px;
  border-top:1px solid var(--linea2); cursor:pointer}
.chk:first-of-type{border-top:none}
.chk > input{flex:0 0 auto; width:22px; height:22px; margin:1px 0 0;
  accent-color:var(--verde); cursor:pointer}
.chk .d{flex:1; min-width:0}
.chk .n{display:block; font-size:14.5px; font-weight:600; color:var(--blanco);
  line-height:1.35}
.chk .esp{display:block; margin-top:5px; font-family:"IBM Plex Mono",monospace;
  font-size:10.5px; font-weight:600; letter-spacing:.02em; color:var(--ambar)}
.chk .q{display:block; margin-top:6px; font-size:12.5px; line-height:1.5;
  color:var(--gris)}
.chk .q b{color:var(--blanco); font-weight:600}
.chk.si .n{color:var(--verde); text-decoration:line-through;
  text-decoration-color:rgba(47,217,127,.4)}
.chk.si .esp{color:var(--gris2)}

/* ─── Confirmar los datos de un equipo, con el aparato delante ─── */
.conf{padding:12px 0 13px; border-top:1px solid var(--linea2)}
.conf:first-of-type{border-top:none}
.conf > label{display:block; font-size:14.5px; font-weight:600; color:var(--blanco);
  line-height:1.35; margin-bottom:9px}
.conf > label .et{display:block; margin-top:5px; font-family:"IBM Plex Mono",monospace;
  font-size:10px; font-weight:600; letter-spacing:.02em; color:var(--menta)}
.conf > label small{display:block; margin-top:6px; font-size:12.5px; font-weight:400;
  color:var(--gris); line-height:1.5}
.conf > label small b{color:var(--blanco); font-weight:600}
.conf.puesto > label{color:var(--verde)}
.conf.puesto .uni input{border-color:rgba(47,217,127,.45); color:var(--verde);
  background:var(--verde-s)}
.caja h2 .cont.ok{background:var(--verde)}
.btn.ghost{background:transparent; color:var(--verde); border:1px solid rgba(47,217,127,.35)}

/* ─── Qué cuesta arreglar cada aviso de compatibilidad ─── */
.arreglo{display:inline-block; margin-left:8px; padding:2px 8px; border-radius:20px;
  font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; vertical-align:1px; white-space:nowrap}
.arreglo.menu{color:var(--ambar); background:var(--ambar-s); border:1px solid rgba(251,191,36,.3)}
.arreglo.equipo{color:var(--rojo); background:var(--rojo-s); border:1px solid rgba(251,113,133,.32)}
.arreglo.saber{color:var(--menta); background:var(--menta-s); border:1px solid rgba(94,234,212,.3)}

/* Dónde va físicamente una pieza, y la cuenta de la que sale una cantidad */
.donde{display:block; margin-top:4px; font-family:"IBM Plex Mono",monospace;
  font-size:10px; font-weight:500; letter-spacing:.02em; color:var(--gris2);
  text-transform:none}
.cuenta{display:block; margin-top:7px; padding:7px 10px; border-radius:7px;
  background:var(--panel2); border-left:2px solid var(--linea);
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; line-height:1.6;
  color:var(--gris2); letter-spacing:.01em}

/* ─── Las dos ofertas, para compararlas delante del cliente ─── */
.opciones{display:flex; flex-direction:column; gap:10px; margin:-2px 0 2px}
.op{padding:14px 15px 15px; border-radius:12px; background:var(--panel2);
  border:1px solid var(--linea)}
.op.principal{background:linear-gradient(180deg, var(--verde-s), transparent);
  border-color:rgba(47,217,127,.3)}
.op .et{display:block; font-family:"IBM Plex Mono",monospace; font-size:9.5px;
  font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--gris2);
  margin-bottom:7px}
.op.principal .et{color:var(--verde)}
.op > b{display:block; font-family:"Archivo",sans-serif; font-size:24px; font-weight:800;
  color:var(--blanco); line-height:1.15; letter-spacing:-.01em}
.op.principal > b{color:var(--verde)}
.op .sub{display:block; margin-top:8px; font-size:12.5px; line-height:1.55; color:var(--gris)}

/* ─── Avisos del kit ─── */
.av{padding:12px 0 13px; border-top:1px solid var(--linea2)}
.av:first-child{border-top:none; padding-top:4px}
.av .q{display:block; font-family:"Archivo",sans-serif; font-size:14px; font-weight:700;
  margin-bottom:5px}
.av .tp{display:block; font-size:13px; line-height:1.58; color:var(--gris)}
.av .tp b{color:var(--blanco); font-weight:600}
.av.alto .q{color:var(--rojo)}
.av.alto .tp b{color:#FFC2CC}
.av.medio .q{color:var(--ambar)}
.av.info .q{color:var(--menta)}

/* ─── Problemas de alto riesgo ─── */
.riesgo{margin:10px 0; padding:13px 14px 14px; border-radius:11px;
  background:var(--panel2); border:1px solid var(--linea)}
.riesgo.alto{background:var(--rojo-s); border-color:rgba(251,113,133,.3)}
.riesgo.medio{background:var(--ambar-s); border-color:rgba(251,191,36,.26)}
.riesgo .q{font-family:"Archivo",sans-serif; font-size:15.5px; font-weight:800;
  color:var(--blanco); line-height:1.3}
.riesgo .niv{display:block; font-family:"IBM Plex Mono",monospace; font-size:9px;
  font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px}
.riesgo.alto .niv{color:var(--rojo)}
.riesgo.medio .niv{color:var(--ambar)}
.riesgo.info .niv{color:var(--menta)}
.riesgo .tp{font-size:13.5px; line-height:1.6; color:var(--gris); margin-top:8px}
.riesgo .tp b{color:var(--blanco); font-weight:600}
.riesgo .tp i{color:var(--blanco); font-style:normal; background:rgba(255,255,255,.05);
  padding:1px 5px; border-radius:4px}
.riesgo .sol{margin-top:11px; padding-top:11px; border-top:1px solid var(--linea);
  font-size:13px; line-height:1.58; color:var(--gris)}
.riesgo .sol b{color:var(--blanco); font-weight:600}
.riesgo .sol .et{display:block; font-family:"IBM Plex Mono",monospace; font-size:9px;
  font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--verde);
  margin-bottom:5px}

.clausula{padding:14px 15px; border-radius:11px; background:var(--panel2);
  border:1px solid var(--linea); font-size:13.5px; line-height:1.68; color:var(--blanco)}

/* Notas de equipo: rojas siempre, por pedido expreso. Es donde están los
   datos sin confirmar y los límites que queman un inversor. */
.nota{display:flex; gap:10px; align-items:flex-start; margin:4px 0 2px;
  padding:11px 13px 12px; border-radius:10px;
  background:var(--rojo-s); border:1px solid rgba(251,113,133,.26)}
.nota .et{flex:0 0 auto; font-family:"IBM Plex Mono",monospace; font-size:9px;
  font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--rojo); padding-top:2px}
.nota .tp{font-size:13px; line-height:1.55; color:var(--rojo)}
.nota .tp b{color:#FFC2CC; font-weight:700}
.nota .tp a{color:var(--rojo); text-decoration:underline}

.pista{font-size:13px; color:var(--gris); padding:12px 16px 14px; line-height:1.55;
  border-top:1px solid var(--linea2); background:rgba(255,255,255,.012)}
.pista b{color:var(--blanco); font-weight:600}

/* ── campos ── */
.campo{display:grid; grid-template-columns:1fr 146px; gap:12px; align-items:center;
  padding:11px 0; border-bottom:1px solid var(--linea2)}
.campo:last-child{border-bottom:none}
.campo > label{font-size:15px; line-height:1.3; font-weight:500}
.campo > label small{display:block; font-size:12.5px; color:var(--gris); margin-top:3px;
  font-weight:400; line-height:1.4}
.campo input,.campo select,.campo textarea{width:100%; font:inherit; font-size:16px;
  padding:10px 11px; border:1px solid var(--linea); border-radius:9px;
  background:var(--panel2); color:var(--blanco); text-align:right;
  font-family:"IBM Plex Mono",monospace; font-weight:600}
.campo input:hover,.campo select:hover{border-color:var(--gris2)}
.campo select{text-align:left; font-family:"IBM Plex Sans",sans-serif; font-size:14px}
.campo.ancho{grid-template-columns:1fr}
.campo.ancho input,.campo.ancho textarea,.campo.ancho select{text-align:left;
  font-family:"IBM Plex Sans",sans-serif; font-weight:400}
.campo textarea{min-height:80px; resize:vertical; line-height:1.5}
.uni{position:relative; display:block}
.uni input{padding-right:42px !important; width:100%}
.uni span{position:absolute; right:11px; top:50%; transform:translateY(-50%);
  font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
  color:var(--gris2); pointer-events:none; letter-spacing:.02em}
.campo .calc{text-align:right; font-family:"IBM Plex Mono",monospace; font-weight:700;
  font-size:14px; color:var(--verde); white-space:nowrap}
input::placeholder,textarea::placeholder{color:var(--gris2)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--verde); outline-offset:2px}

/* ── filas de resultado ── */
.fila{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 14px;
  align-items:baseline; padding:11px 0; border-bottom:1px solid var(--linea2)}
.fila:last-child{border-bottom:none}
/* El titulo nunca baja de este ancho: si el valor no cabe al lado, es el valor
   el que se va a su propia linea, no el titulo el que se estrangula. */
.fila .tx{flex:1 1 auto; min-width:min(56%, 190px); font-weight:500}
.fila .nt{flex:1 0 100%; font-size:12.5px; color:var(--gris); margin-top:2px;
  line-height:1.5; font-weight:400}
.fila .nt b{color:var(--blanco); font-weight:600}
.fila small{display:block; font-size:12.5px; color:var(--gris); margin-top:3px;
  line-height:1.5; font-weight:400}
.fila small b{color:var(--blanco); font-weight:600}
.fila .vl{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:14px;
  text-align:right; white-space:nowrap; flex:0 0 auto; margin-left:auto;
  color:var(--blanco)}
.sep{font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--verde);
  margin:14px -16px 0; padding:10px 16px 8px;
  border-top:1px solid var(--linea); border-bottom:1px solid var(--linea2)}
.ok{color:var(--verde)} .warn{color:var(--ambar)} .bad{color:var(--rojo)} .info{color:var(--menta)}
.elegido{font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; background:var(--verde);
  color:#04160C; border-radius:5px; padding:3px 7px; margin-left:6px; vertical-align:1px}
.mini{border:1px solid var(--linea); background:var(--panel2); color:var(--gris);
  border-radius:7px; padding:3px 9px; font-size:11.5px; font-weight:600; margin-left:8px}
.mini:hover{color:var(--rojo); border-color:var(--rojo)}

/* punto de estado: sustituye a los emoji */
.pt{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px;
  vertical-align:1px; flex-shrink:0}
.pt.ok{background:var(--verde); box-shadow:0 0 0 3px var(--verde-s)}
.pt.warn{background:var(--ambar); box-shadow:0 0 0 3px var(--ambar-s)}
.pt.bad{background:var(--rojo); box-shadow:0 0 0 3px var(--rojo-s)}
.pt.info{background:var(--menta); box-shadow:0 0 0 3px var(--menta-s)}

/* ── la respuesta grande ── */
.titular{margin:-4px -16px 6px; padding:18px 16px 17px;
  border-bottom:1px solid var(--linea); background:
    linear-gradient(180deg, var(--verde-s), transparent)}
.titular > b{font-family:"Archivo",sans-serif; font-size:25px; font-weight:800;
  color:var(--verde); display:block; line-height:1.1; letter-spacing:-.015em}
.titular small{display:block; font-size:13.5px; color:var(--gris); margin-top:9px; line-height:1.55}
.titular small b{color:var(--blanco); font-weight:600}
.titular.rojo{background:linear-gradient(180deg, var(--rojo-s), transparent)}
.titular.rojo > b{color:var(--rojo)}
.cuerpo > .titular:only-child{margin-bottom:-12px; border-bottom:none; padding-bottom:16px}
.titular.info{background:linear-gradient(180deg, var(--menta-s), transparent)}
.titular.ahora{background:linear-gradient(180deg, var(--naranja-s), transparent)}
.titular.ahora > b{color:var(--naranja)}
.titular.info > b{color:var(--menta)}

/* ── trabajos ── */
.trab{display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  background:var(--panel); border:1px solid var(--linea); border-radius:var(--r);
  padding:14px 15px; margin-bottom:9px}
.trab:hover{border-color:var(--gris2)}
.trab[aria-current="true"]{border-color:var(--verde); background:var(--verde-s)}
.trab{flex-wrap:wrap}
.trab .d{flex:1 1 60%; min-width:0}
.trab .nm{display:block; font-weight:600; font-size:16.5px;
  font-family:"Archivo",sans-serif; line-height:1.25}
.trab .zn{display:block; font-size:12px; color:var(--gris); margin-top:5px;
  font-family:"IBM Plex Mono",monospace; line-height:1.45}
.trab .estado{flex:0 0 auto; margin-left:auto; align-self:flex-start}
.estado{font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:700;
  letter-spacing:.09em; text-transform:uppercase; padding:5px 9px; border-radius:6px;
  white-space:nowrap; border:1px solid}
.estado.agendar{color:var(--naranja); border-color:rgba(255,138,60,.34); background:var(--naranja-s)}
.estado.visita{color:var(--gris); border-color:var(--linea); background:var(--panel2)}
.estado.cotizado{color:var(--verde); border-color:rgba(59,191,240,.3); background:var(--verde-s)}
.estado.aceptado{color:var(--ambar); border-color:rgba(251,191,36,.3); background:var(--ambar-s)}
.estado.montado{color:var(--verde); border-color:rgba(52,211,153,.3); background:var(--verde-s)}

.btn{display:block; width:100%; border:none; border-radius:12px; padding:15px;
  font-size:15.5px; font-weight:700; font-family:"Archivo",sans-serif;
  background:var(--verde); color:#04160C; margin-top:5px; letter-spacing:-.01em}
.btn:hover{background:var(--verde-h)}
.btn.gris{background:var(--panel2); color:var(--blanco); border:1px solid var(--linea)}
.btn.gris:hover{border-color:var(--gris2)}
.btn.peligro{background:transparent; color:var(--rojo); border:1px solid rgba(251,113,133,.35)}
.btn.peligro:hover{background:var(--rojo-s)}

/* ── dinero ── */
.kpi{background:var(--panel); border:1px solid var(--linea); border-radius:var(--r);
  padding:17px 16px; margin-bottom:11px}
.kpi .k{font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:700;
  letter-spacing:.13em; text-transform:uppercase; color:var(--gris2)}
.kpi .v{font-family:"IBM Plex Mono",monospace; font-size:34px; font-weight:700;
  margin-top:6px; line-height:1; letter-spacing:-.02em}
.kpi .s{font-size:12.5px; color:var(--gris); margin-top:7px; line-height:1.5}
.kpi.dos{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.kpi.dos .v{font-size:23px}
.bloqueado{text-align:center; padding:56px 26px; color:var(--gris)}
.bloqueado b{display:block; font-family:"Archivo",sans-serif; font-size:23px;
  color:var(--blanco); margin-bottom:8px; font-weight:700}
.vacio{text-align:center; padding:36px 22px; color:var(--gris)}
.vacio b{display:block; font-family:"Archivo",sans-serif; font-size:22px;
  color:var(--blanco); margin-bottom:6px}

/* ── clave de oficina ── */
.clave{position:fixed; inset:0; z-index:90; background:rgba(5,6,8,.92);
  display:flex; align-items:center; justify-content:center; padding:24px;
  backdrop-filter:blur(6px)}
.clave[hidden]{display:none}
.clave .caja-c{background:var(--panel); border:1px solid var(--linea);
  border-radius:18px; padding:26px 22px; max-width:340px; width:100%; text-align:center}
.clave h3{font-family:"Archivo",sans-serif; font-size:21px; font-weight:700; margin-bottom:6px}
.clave p{font-size:13.5px; color:var(--gris); margin:0 0 18px; line-height:1.5}
.clave .caja-c{border-top:3px solid var(--naranja)}
.clave input{width:100%; font-family:"IBM Plex Mono",monospace; font-size:26px;
  font-weight:700; text-align:center; letter-spacing:.35em; padding:14px 10px;
  border:1px solid var(--linea); border-radius:11px; background:var(--panel2);
  color:var(--blanco)}
.clave .falta-i{padding:9px 0; border-bottom:1px solid var(--linea2)}
.clave .falta-i:last-child{border-bottom:none}
.clave .falta-i b{display:block; font-size:15px; color:var(--blanco)}
.clave .falta-i span{display:block; font-size:12.5px; color:var(--gris); margin-top:3px; line-height:1.45}
.clave .falta-i em{font-family:"IBM Plex Mono",monospace; font-style:normal; font-size:9.5px;
  font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ambar)}
.clave .msg{font-size:13px; color:var(--rojo); margin-top:11px; min-height:18px; font-weight:600}
.clave .acciones{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:16px}
.clave .acciones .btn{margin-top:0}

/* ── la cotización: documento en papel, no pantalla ── */
.hojaCot{position:fixed; inset:0; z-index:80; background:#F6F4F0; overflow:auto;
  -webkit-overflow-scrolling:touch}
.hojaCot[hidden]{display:none}
.barraCot{position:sticky; top:0; z-index:2; display:flex; gap:8px; align-items:center;
  background:#FFF; border-bottom:1px solid #DED9D1; padding:10px 14px}
.barraCot .tit{flex:1; font-family:"Archivo",sans-serif; font-weight:700; font-size:15px;
  color:#1A1714; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.barraCot button{border:1px solid #DED9D1; background:#FFF; color:#3A342D;
  border-radius:9px; padding:8px 13px; font-size:13.5px; font-weight:600}
.barraCot button.prin{background:#E8701F; border-color:#E8701F; color:#FFF}

.cot{max-width:720px; margin:0 auto; padding:26px 22px 60px; background:#FFF;
  color:#1A1714; font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15.5px; line-height:1.6; min-height:100%}
.cot .cab{display:flex; justify-content:space-between; align-items:flex-start;
  gap:16px; flex-wrap:wrap; padding-bottom:18px; border-bottom:2px solid #1A1714}
.cot .marca{display:flex; align-items:center; gap:11px}
.cot .emp{font-family:"Archivo",sans-serif; font-weight:800; font-size:19px;
  letter-spacing:-.015em; line-height:1.1}
.cot .lin{font-size:12.5px; color:#6B635A; margin-top:2px}
.cot .ref{text-align:right; font-family:"IBM Plex Mono",monospace; font-size:10px;
  letter-spacing:.11em; text-transform:uppercase; color:#8A8075}
.cot .ref .fh{color:#1A1714; margin-top:3px; letter-spacing:.02em; text-transform:none;
  font-size:12.5px}
.cot h1{font-family:"Archivo",sans-serif; font-size:29px; font-weight:800;
  letter-spacing:-.02em; margin:24px 0 0; line-height:1.15}
.cot .zona{color:#6B635A; margin:4px 0 0; font-size:15px}
.cot h2{font-family:"Archivo",sans-serif; font-size:13px; font-weight:700;
  text-transform:uppercase; letter-spacing:.11em; color:#8A8075;
  margin:30px 0 12px; padding-bottom:7px; border-bottom:1px solid #E5E0D8}
.cot .cuerpo{margin:0 0 12px; color:#3A342D}
.cot .cuerpo b{color:#1A1714}

.cot .destacado{margin-top:24px}
.cot .precio-caja{background:#FBF5EE; border:1px solid #EEDFCC; border-radius:14px;
  padding:20px 22px}
.cot .precio-caja .et{font-family:"IBM Plex Mono",monospace; font-size:10px;
  font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#8A8075}
.cot .precio-caja .cifra{font-family:"IBM Plex Mono",monospace; font-size:40px;
  font-weight:700; color:#C25A12; margin-top:6px; line-height:1; letter-spacing:-.02em}
.cot .precio-caja .nota{font-size:13.5px; color:#6B635A; margin-top:9px}
.cot .precio-caja .nota b{color:#1A1714}

.cot table{width:100%; border-collapse:collapse; font-size:15px}
.cot td{padding:11px 0; border-bottom:1px solid #EFEBE4; vertical-align:top}
.cot td.v{text-align:right; font-family:"IBM Plex Mono",monospace; font-weight:600;
  white-space:nowrap; padding-left:14px}
.cot tr:last-child td{border-bottom:none}

.cot .lista{margin:0; padding-left:20px; color:#3A342D; font-size:14.5px}
.cot .lista li{margin-bottom:6px}
.cot .lista b{color:#1A1714}
/* Los puntos que el cliente asume, y las rayas donde firma. Esto se imprime
   y se guarda: es lo que separa una averia cubierta de una discusion. */
.cot .lista.riesgos li{color:#8C2F1E; font-weight:600}
.cot .asume{margin-top:14px; padding:15px 17px; border-radius:6px;
  background:#FBF3EF; border:1px solid #E3C9BF; color:#5A2418; font-size:14.5px;
  line-height:1.65}
.cot .firmas{display:flex; gap:30px; margin:28px 0 6px}
.cot .firmas > div{flex:1; font-size:12px; letter-spacing:.06em;
  text-transform:uppercase; color:#8A8075}
.cot .firmas span{display:block; height:44px; border-bottom:1.5px solid #B9AFA2;
  margin-bottom:7px}

.cot .condiciones{margin:0; padding-left:22px; color:#3A342D; font-size:15px}
.cot .condiciones li{margin-bottom:12px}
.cot .condiciones b{color:#1A1714}

.cot .pie{margin-top:34px; padding-top:18px; border-top:2px solid #1A1714;
  font-size:14px; color:#3A342D}
.cot .pie .validez b{color:#1A1714}
.cot .pie .pago{margin-top:7px; color:#6B635A; font-size:13.5px}

@media (max-width:560px){
  .cot .cab{flex-direction:column; align-items:flex-start; gap:12px}
  .cot .ref{text-align:left}
  .cot h1{font-size:25px}
  .cot .precio-caja .cifra{font-size:34px}
  /* la tabla se parte en dos lineas: etiqueta arriba, dato abajo */
  .cot table,.cot tbody,.cot tr,.cot td{display:block; width:100%}
  .cot tr{padding:11px 0; border-bottom:1px solid #EFEBE4}
  .cot tr:last-child{border-bottom:none}
  .cot td{padding:0; border:none}
  .cot td.v{text-align:left; padding:3px 0 0; color:#6B635A; white-space:normal}
}

@media print{
  .barraCot{display:none}
  .hojaCot{position:static; background:#FFF; overflow:visible}
  .cot{max-width:none; padding:0; font-size:11pt}
  .cot h2{page-break-after:avoid}
  .cot .condiciones li,.cot .lista li{page-break-inside:avoid}
}

/* ── navegación inferior ── */
.nav{flex:0 0 auto; z-index:50; display:flex;
  background:var(--negro);
  border-top:1px solid var(--linea); padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1; border:none; background:transparent; color:var(--gris2);
  padding:10px 2px 11px; display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size:9.5px; font-weight:700; font-family:"IBM Plex Mono",monospace;
  letter-spacing:.06em; text-transform:uppercase; position:relative}
.nav button svg{width:21px; height:21px}
.nav button[aria-current="page"]{color:var(--verde)}
.nav button[aria-current="page"]::before{content:""; position:absolute; top:0;
  left:50%; transform:translateX(-50%); width:30px; height:2px;
  background:var(--verde); border-radius:0 0 3px 3px}
.nav button[hidden]{display:none}
/* Ya no hace falta apartar la barra cuando sale el teclado: al estar dentro
   de la columna, el teclado encoge el contenido y la barra se queda donde
   esta, visible y quieta. */

@media (min-width:780px){
  body{display:block; height:auto; min-height:100dvh; overflow:visible}
  .top{position:sticky; top:0}
  main{overflow:visible}
  .campo{grid-template-columns:1fr 180px}
  main{padding-bottom:30px}
  .nav{position:sticky; top:0; bottom:auto; border-top:none;
    border-bottom:1px solid var(--linea); max-width:980px; margin:0 auto;
    background:rgba(10,11,13,.94)}
  .nav button{flex-direction:row; gap:8px; font-size:11px; padding:13px 6px}
  .nav button[aria-current="page"]::before{top:auto; bottom:0; border-radius:3px 3px 0 0}
}
@media (prefers-reduced-motion:no-preference){
  .pant.on{animation:entra .2s ease-out}
  @keyframes entra{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
}
</style>
